<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>A2A with Agent Registry</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#f7f9fc;color:#172033}
.wrap{max-width:1580px;margin:24px auto;padding:0 18px}
h1{font-size:26px;margin:0 0 8px}.sub{margin:0 0 18px;color:#52606d}
.card{background:#fff;border:1px solid #d9e2ec;border-radius:16px;overflow:auto}
svg{width:1560px;height:1080px;display:block}
.head{font-weight:700;font-size:16px;fill:#172033}.small{font-size:12px;fill:#486581}
.msg{font-size:13px;fill:#102a43}.life{stroke:#9fb3c8;stroke-width:1.5;stroke-dasharray:6 6}
.arrow{stroke:#243b53;stroke-width:2;fill:none;marker-end:url(#a)}
.ret{stroke:#486581;stroke-width:2;fill:none;stroke-dasharray:7 6;marker-end:url(#a)}
.box{fill:#f8fbff;stroke:#7699d4;stroke-width:1.5;rx:10}
.phase{fill:#f8fafc;stroke:#d9e2ec;stroke-width:1;rx:10}
.label{font-size:12px;font-weight:700;fill:#274c77}
</style>
</head>
<body><div class="wrap">
<h1>Agent2Agent (A2A) with Agent Registry — Sequence Diagram</h1>
<p class="sub">Enterprise example: discover the right agent via a registry, fetch its Agent Card, then communicate using A2A.</p>
<div class="card"><svg viewBox="0 0 1560 1080" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#243b53"/></marker></defs>

<rect class="box" x="20" y="38" width="155" height="70"/><text class="head" x="97" y="66" text-anchor="middle">User</text><text class="small" x="97" y="88" text-anchor="middle">Initiates goal</text>
<rect class="box" x="215" y="38" width="210" height="70"/><text class="head" x="320" y="66" text-anchor="middle">Client Agent</text><text class="small" x="320" y="88" text-anchor="middle">Delegates work</text>
<rect class="box" x="465" y="38" width="210" height="70"/><text class="head" x="570" y="66" text-anchor="middle">External Registry</text><text class="small" x="570" y="88" text-anchor="middle">Non-A2A endpoint catalog</text>
<rect class="box" x="715" y="38" width="200" height="70"/><text class="head" x="815" y="66" text-anchor="middle">Agent Card</text><text class="small" x="815" y="88" text-anchor="middle">Capabilities + interfaces</text>
<rect class="box" x="955" y="38" width="225" height="70"/><text class="head" x="1067" y="66" text-anchor="middle">Remote Agent</text><text class="small" x="1067" y="88" text-anchor="middle">A2A server / black box</text>
<rect class="box" x="1220" y="38" width="300" height="70"/><text class="head" x="1370" y="66" text-anchor="middle">Remote Agent Internals</text><text class="small" x="1370" y="88" text-anchor="middle">LLM · MCP · tools · workflows</text>

<line class="life" x1="97" y1="108" x2="97" y2="1015"/><line class="life" x1="320" y1="108" x2="320" y2="1015"/>
<line class="life" x1="570" y1="108" x2="570" y2="1015"/><line class="life" x1="815" y1="108" x2="815" y2="1015"/>
<line class="life" x1="1067" y1="108" x2="1067" y2="1015"/><line class="life" x1="1370" y1="108" x2="1370" y2="1015"/>

<rect class="phase" x="15" y="135" width="1525" height="315"/><text class="label" x="35" y="160">DISCOVERY</text>
<line class="arrow" x1="97" y1="200" x2="320" y2="200"/><text class="msg" x="208" y="186" text-anchor="middle">1. User asks for a goal</text>

<line class="arrow" x1="320" y1="250" x2="570" y2="250"/><text class="msg" x="445" y="236" text-anchor="middle">2. Find agent for capability</text>
<text class="small" x="445" y="254" text-anchor="middle">e.g. “expense approval”</text>

<line class="ret" x1="570" y1="300" x2="320" y2="300"/><text class="msg" x="445" y="286" text-anchor="middle">3. Return agent identity/base URL</text>

<line class="arrow" x1="320" y1="350" x2="815" y2="350"/><text class="msg" x="568" y="336" text-anchor="middle">4. Fetch Agent Card</text>
<line class="ret" x1="815" y1="405" x2="320" y2="405"/><text class="msg" x="568" y="383" text-anchor="middle">5. Skills, A2A version, supported interfaces, auth</text>

<rect class="phase" x="15" y="470" width="1525" height="455"/><text class="label" x="35" y="495">A2A COLLABORATION</text>
<path class="arrow" d="M320 540 C400 540 400 585 320 585"/><text class="msg" x="435" y="553">6. Select interface + authenticate</text><text class="small" x="435" y="571">HTTP+JSON / JSON-RPC / gRPC</text>

<line class="arrow" x1="320" y1="635" x2="1067" y2="635"/><text class="msg" x="694" y="615" text-anchor="middle">7. SendMessage(...) / start Task</text>
<text class="small" x="694" y="633" text-anchor="middle">A2A request using selected protocol binding</text>

<path class="arrow" d="M1067 680 C1150 680 1150 725 1067 725"/><text class="msg" x="1190" y="693">8. Interpret request and manage task state</text>

<line class="arrow" x1="1067" y1="770" x2="1370" y2="770"/><text class="msg" x="1218" y="750" text-anchor="middle">9. Execute private workflow</text>
<text class="small" x="1218" y="768" text-anchor="middle">May call MCP servers, APIs, DBs, tools</text>

<line class="ret" x1="1370" y1="820" x2="1067" y2="820"/><text class="msg" x="1218" y="806" text-anchor="middle">10. Internal result</text>

<line class="ret" x1="1067" y1="875" x2="320" y2="875"/><text class="msg" x="694" y="855" text-anchor="middle">11. Task status / Message / Artifact(s)</text>
<text class="small" x="694" y="873" text-anchor="middle">working · input-required · completed · failed · etc.</text>

<rect class="phase" x="15" y="945" width="1525" height="75"/><text class="label" x="35" y="970">DELIVERY</text>
<line class="arrow" x1="320" y1="995" x2="97" y2="995"/><text class="msg" x="208" y="981" text-anchor="middle">12. Return outcome to user</text>

<text class="small" x="25" y="1050">External registry (not A2A) = “Which agent endpoint should I use?”  |  Agent Card = “What can this agent do and how?”  |  A2A = “How do agents collaborate?”  |  MCP = “How does an agent access tools/data?”</text>
</svg></div></div></body></html>
