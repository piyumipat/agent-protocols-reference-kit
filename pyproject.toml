[project]
name = "agent-protocols-reference-kit"
version = "0.2.0"
description = "Standards-faithful implementations of major agent communication protocols"
readme = "README.md"
license = "MIT"
keywords = ["agents", "a2a", "agora", "anp", "mcp", "protocols"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Typing :: Typed",
]
authors = [
    { name = "Piyumi Pathirathna", email = "312393932+piyumipat@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "openai>=3.5.0",
    "python-dotenv>=1.0.1",
]

[project.urls]
Homepage = "https://github.com/piyumipat/agent-protocols-reference-kit"
Repository = "https://github.com/piyumipat/agent-protocols-reference-kit.git"
Documentation = "https://github.com/piyumipat/agent-protocols-reference-kit/tree/main/docs"
Issues = "https://github.com/piyumipat/agent-protocols-reference-kit/issues"

# Per-protocol extras: consumers install only the SDKs they need
# (e.g. `uv add agent-protocols-reference-kit[a2a]`), not every protocol's
# dependencies at once. `all` pulls every protocol.
[project.optional-dependencies]
mcp = [
    "mcp[cli]>=2.1.1",
]
a2a = [
    "a2a-sdk[http-server,signing]>=1.1.2,<2",
    "PyJWT[crypto]>=2.8,<3",
    "jcs>=0.2.1",
    "uvicorn>=0.35",
]
anp = [
    "anp==1.0.3",
]
agora = [
    "httpx>=0.28",
    "PyYAML>=6.0",
    "starlette>=0.47",
    "uvicorn>=0.35",
]
all = [
    "agent-protocols-reference-kit[mcp]",
    "agent-protocols-reference-kit[a2a]",
    "agent-protocols-reference-kit[anp]",
    "agent-protocols-reference-kit[agora]",
]

[dependency-groups]
dev = [
    "anp==1.0.3",
    "a2a-sdk[http-server,signing]>=1.1.2,<2",
    "PyJWT[crypto]>=2.8,<3",
    "jcs>=0.2.1",
    "mcp[cli]>=2.1.1",
    "PyYAML>=6.0",
    "pytest",
    "ruff",
    "mypy",
    "pytest-asyncio>=1.4.0",
    "pytest-timeout>=2.4.0",
    "types-PyYAML>=6.0",
    "uvicorn>=0.35",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_protocols"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
timeout = 20

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = ["anp.*"]
ignore_missing_imports = true
